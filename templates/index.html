<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Shopping Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="header-content">
                <div class="bot-avatar">
                    <img src="https://cdn-icons-png.flaticon.com/512/4711/4711984.png" alt="AI Assistant">
                </div>
                <div class="user_info header-text">
                    <h1 class="header-title">AI Shopping Assistant</h1>
                    <div class="status">
                        <span class="status-dot"></span>
                        Answers from real customer reviews
                    </div>
                </div>
                <button type="button" class="reset-btn" id="resetBtn" title="Start a new conversation">New chat</button>
            </div>
        </div>

        <div class="chat-messages" id="messages" aria-live="polite">
            <div class="message bot-message">
                <div class="img_cont_msg">
                    <img src="https://cdn-icons-png.flaticon.com/512/4711/4711984.png" class="user_img_msg" alt="Bot avatar">
                </div>
                <div class="message-content">
                    <div class="message-text">Hi! Ask me about products and I'll answer from real reviews, with sources. Try one of these:</div>
                    <div class="suggestions">
                        <button type="button" class="suggestion">Best earbuds with good bass under 2000?</button>
                        <button type="button" class="suggestion">Which headphones have the best battery life?</button>
                        <button type="button" class="suggestion">What do people complain about most?</button>
                    </div>
                </div>
            </div>
        </div>

        <form class="input-container" id="chatForm">
            <input type="text" id="userInput" maxlength="1000" autocomplete="off"
                   placeholder="Ask about products, reviews, or recommendations..." aria-label="Your question">
            <button type="submit" class="send-btn" id="sendBtn">
                <span class="btn-text">Send</span>
                <svg class="send-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </form>
    </div>

    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
