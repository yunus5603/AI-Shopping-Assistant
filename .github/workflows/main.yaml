name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "images/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest --cov=flipkart --cov=app --cov-report=term-missing

  docker-build:
    name: Docker build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t shopping-assistant:ci .

  build-and-push-ecr-image:
    name: Continuous Delivery
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" -t "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" .
          docker push --all-tags "$ECR_REGISTRY/$ECR_REPOSITORY"

  continuous-deployment:
    name: Continuous Deployment
    needs: build-and-push-ecr-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    env:
      IMAGE: ${{ secrets.AWS_ECR_LOGIN_URI }}/${{ secrets.ECR_REPOSITORY_NAME }}:latest
      CONTAINER: shopping-assistant
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull latest image
        run: docker pull "$IMAGE"

      - name: Replace running container
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ASTRA_DB_API_ENDPOINT: ${{ secrets.ASTRA_DB_API_ENDPOINT }}
          ASTRA_DB_APPLICATION_TOKEN: ${{ secrets.ASTRA_DB_APPLICATION_TOKEN }}
          ASTRA_DB_KEYSPACE: ${{ secrets.ASTRA_DB_KEYSPACE }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FLASK_SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY }}
        run: |
          docker rm -f "$CONTAINER" 2>/dev/null || true
          # Values are passed by name, so secrets never appear in the command line or logs.
          docker run -d --restart unless-stopped -p 5000:5000 --name "$CONTAINER" \
            -e GROQ_API_KEY -e ASTRA_DB_API_ENDPOINT -e ASTRA_DB_APPLICATION_TOKEN \
            -e ASTRA_DB_KEYSPACE -e HF_TOKEN -e FLASK_SECRET_KEY \
            "$IMAGE"

      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            curl -fsS http://localhost:5000/health && exit 0
            sleep 3
          done
          docker logs --tail 50 "$CONTAINER"
          exit 1

      - name: Clean up old images
        run: docker image prune -f
