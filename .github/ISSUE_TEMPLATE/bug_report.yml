name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `python app.py`
        2. Ask "..."
        3. See error
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any API keys or tokens before pasting.
      render: shell
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: OS, Python version, Docker or local
